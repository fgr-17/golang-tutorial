services:
  golang-tutorial:
    build: .
    container_name: golang-tutorial
    environment:
      GOLANG_TUTORIAL_IN_CONTAINER: "1"
    volumes:
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Keep the container alive so you can docker exec into it.
    command: sleep infinity
